# Publish to GitHub Packages (npm.pkg.github.com) when a version tag is pushed:
#   `bun run release [patch|minor|major|x.y.z]` (scripts/release.ts) bumps, tags and pushes.
# Consumers that install from a git ref (github:belkamax05/dev-tools#v0.2.0) don't need this.
name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # npm, not `bun publish`: bun's NPM_CONFIG_TOKEN only authenticates the
      # default registry, so publishConfig's npm.pkg.github.com got "missing
      # authentication". setup-node writes an .npmrc carrying NODE_AUTH_TOKEN
      # for exactly this registry - GitHub's documented route.
      - uses: actions/setup-node@v4
        with:
          registry-url: https://npm.pkg.github.com
          scope: '@belkamax05'
      - name: Tag matches package.json version
        run: |
          version=$(bun -p 'require("./package.json").version')
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - run: bun install --frozen-lockfile
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
